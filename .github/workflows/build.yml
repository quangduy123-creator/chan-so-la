name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChanSoLa-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to Releases (tag "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ChanSoLa.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest ChanSoLa.apk -t "Chặn Số Lạ - bản mới nhất" -n "Build tự động từ commit ${GITHUB_SHA::7}"
